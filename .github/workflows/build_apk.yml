name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd flutter_pos
          flutter pub get

      - name: Build APK (Release)
        run: |
          cd flutter_pos
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cafe-POS-Android-APK
          path: flutter_pos/build/app/outputs/flutter-apk/app-release.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: flutter-apk-latest
          name: "Cafe POS Flutter Android APK 📱"
          body: |
            ## تطبيق الكاشير ونقطة البيع للهاتف والأندرويد (Flutter APK) ☕📱
            
            - مبني بالكامل عبر Google Flutter
            - واجهة كروت متطابقة ومتساوية 100% مع فلاتر الخيارات الكاملة (المزاج، الحجم، السكر، الإضافات)
            - لوحة الفاتورة والسلة المتكاملة مع طباعة الفواتير
            
            ### طريقة التثبيت:
            1. حمّل ملف `app-release.apk` المرفق أدناه إلى هاتفك أو التابلت.
            2. اضغط على الملف لتثبيته فوراً.
          files: flutter_pos/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
